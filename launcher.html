<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyTvApp</title>
<!-- Samsung TV Web API (AVPlay). Only an installed app's own page can load it,
     which is why the downloaded app is built inside this page. -->
<script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
<style id="launcherStyle">
	html, body { margin: 0; width: 1920px; height: 1080px; background: #000; color: #8a8a8a;
		font-family: 'Samsung One', 'Noto Sans', Arial, sans-serif; overflow: hidden; }
	#msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 28px; }
</style>
</head>
<body>
<div id="msg">Loading MyTvApp&hellip;</div>
<script>
// MyTvApp launcher (installed once).
// Each start it downloads the current app from GitHub Pages (built from the
// repo's main branch) and builds it inside this page, so Samsung's TV APIs,
// AVPlay included, keep working. If GitHub cannot be reached in time, or the
// downloaded app does not start, it opens the copy bundled in this package.
//
// The page is built with ordinary DOM calls (stylesheet, markup, then the
// scripts one after another). Earlier versions used document.write(), which
// replaces the whole document and is not dependable on TV browsers.
(function () {
    'use strict';
    var REMOTE = 'https://miglworld.github.io/MyTvApp/';
    var TIMEOUT_MS = 5000;   // per download
    var START_MS = 10000;    // downloaded app must be running by then
    var CSS_WAIT_MS = 3000;
    var leaving = false;

    function startLocal(reason) {
        if (leaving) return;
        leaving = true;
        try { sessionStorage.setItem('mytvapp_source', 'bundled copy (' + reason + ')'); } catch (e) { /* ignore */ }
        location.replace('index.html');
    }

    // Very old TV browsers: no downloads possible, use the bundled copy.
    if (!window.fetch || !window.Promise || !window.DOMParser) { startLocal('old browser'); return; }

    function fetchText(url) {
        return new Promise(function (resolve, reject) {
            var done = false;
            var timer = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, TIMEOUT_MS);
            fetch(url, { cache: 'no-store' }).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            }).then(function (text) {
                if (done) return;
                done = true; clearTimeout(timer); resolve(text);
            }, function (err) {
                if (done) return;
                done = true; clearTimeout(timer); reject(err);
            });
        });
    }

    // Relative paths point at GitHub Pages, versioned so the TV re-downloads
    // them only when the version changes. Absolute URLs are left alone.
    function remoteUrl(path, v) {
        if (/^(https?:|\/\/|data:|#)/.test(path)) return path;
        return REMOTE + path + (path.indexOf('?') === -1 ? '?' : '&') + 'v=' + v;
    }

    function loadStyles(links, v) {
        return Promise.all(links.map(function (old) {
            return new Promise(function (resolve) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = remoteUrl(old.getAttribute('href'), v);
                // The app must not wait forever for a stylesheet.
                var timer = setTimeout(resolve, CSS_WAIT_MS);
                link.onload = link.onerror = function () { clearTimeout(timer); resolve(); };
                document.head.appendChild(link);
            });
        }));
    }

    // Scripts run in page order, each one after the previous has finished.
    function runScripts(scripts, v) {
        return scripts.reduce(function (chain, old) {
            return chain.then(function () {
                return new Promise(function (resolve, reject) {
                    var src = old.getAttribute('src');
                    // webapis.js is already loaded by this page.
                    if (src && src.indexOf('$WEBAPIS') !== -1) { resolve(); return; }
                    var s = document.createElement('script');
                    if (src) {
                        s.onload = resolve;
                        s.onerror = function () { reject(new Error('could not load ' + src)); };
                        s.src = remoteUrl(src, v);
                        document.body.appendChild(s);
                    } else {
                        s.text = old.textContent;
                        document.body.appendChild(s);
                        resolve();
                    }
                });
            });
        }, Promise.resolve());
    }

    var now = Date.now();
    // package.json carries the version; it doubles as the cache key.
    fetchText(REMOTE + 'package.json?t=' + now).then(function (pkgText) {
        var version = JSON.parse(pkgText).version || String(now);
        return fetchText(REMOTE + 'index.html?v=' + encodeURIComponent(version)).then(function (html) {
            return { html: html, v: encodeURIComponent(version), version: version };
        });
    }).then(function (r) {
        var doc = new DOMParser().parseFromString(r.html, 'text/html');
        if (!doc || !doc.getElementById('app')) throw new Error('unexpected page');

        var slice = Array.prototype.slice;
        var scripts = slice.call(doc.querySelectorAll('script'));
        scripts.forEach(function (s) { if (s.parentNode) s.parentNode.removeChild(s); });
        var links = slice.call(doc.querySelectorAll('link[rel="stylesheet"]'));
        slice.call(doc.body.querySelectorAll('[src]')).forEach(function (el) {
            el.setAttribute('src', remoteUrl(el.getAttribute('src'), r.v));
        });

        return loadStyles(links, r.v).then(function () {
            if (leaving) return;
            // Swap this page's own look for the app's.
            var own = document.getElementById('launcherStyle');
            if (own && own.parentNode) own.parentNode.removeChild(own);
            document.body.innerHTML = doc.body.innerHTML;
            // Tell the app where it came from (shown in Settings).
            window.MYTVAPP_SOURCE = 'GitHub (' + r.version + ')';
            // Safety net: never leave a blank screen.
            setTimeout(function () {
                if (!window.MYTVAPP_STARTED) startLocal('GitHub app did not start');
            }, START_MS);
            return runScripts(scripts, r.v);
        });
    }).catch(function (err) {
        startLocal(err && err.message ? err.message : 'offline');
    });
})();
</script>
</body>
</html>
